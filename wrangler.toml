name = "telegram-time-tracker"
compatibility_date = "2024-04-05"
main = "src/index.ts"

# Set environment variables here (non-sensitive)
# [vars]
# You can add public variables here

# Secrets (Add via `npx wrangler secret put <NAME>`)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# TELEGRAM_BOT_TOKEN
# AI_API_KEY
# TELEGRAM_CHAT_ID

[triggers]
crons = ["0 */2 * * *"]
